name: android-apk
# Builds the NextTram Android app (a Trusted Web Activity around the live PWA) and
# publishes it as a GitHub release so it can be downloaded straight onto a phone.
on:
  workflow_dispatch:
  push:
    branches: [dev, main]
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=nexttram" >> "$GITHUB_ENV"
          else
            echo "No signing secret set: using a throw-away key (the app will show a URL bar)."
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias nexttram -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass temporary -keypass temporary -dname "CN=NextTram"
            echo "KEYSTORE_PASSWORD=temporary" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=nexttram" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle --no-daemon assembleRelease
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk NextTram.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NextTram-apk
          path: NextTram.apk
      - name: Publish release (stable download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest NextTram.apk --target "$GITHUB_SHA" \
            --title "NextTram for Android" \
            --notes "Download NextTram.apk on your Android phone and install it. Built from $GITHUB_SHA."
