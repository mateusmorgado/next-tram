plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def ksFile = System.getenv('KEYSTORE_FILE')

android {
    namespace 'tech.morgado.nexttram.wear'
    compileSdk 36

    defaultConfig {
        applicationId 'tech.morgado.nexttram'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName(System.getenv('VERSION_NAME') ?: '1.0')
    }

    signingConfigs {
        release {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(':shared')
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.wear.tiles:tiles:1.4.1'
    implementation 'androidx.wear.protolayout:protolayout:1.2.1'
    implementation 'androidx.wear.protolayout:protolayout-expression:1.2.1'
    implementation 'androidx.wear.protolayout:protolayout-material:1.2.1'
    implementation 'com.google.guava:guava:32.1.3-android'
}
